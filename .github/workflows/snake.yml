name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ianilbishnoi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300E5FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300E5FF

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
