<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Anil Bishnoi - Building intelligent systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#0b2b45" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bff4ff"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="bgfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#071a2e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="t1"><rect x="360" y="180" width="0" height="40">
      <animate attributeName="width" values="0;0;600;600;0;0" keyTimes="0;0.02;0.10;0.30;0.31;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="360" y="180" width="0" height="40">
      <animate attributeName="width" values="0;0;600;600;0;0" keyTimes="0;0.34;0.42;0.62;0.63;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="360" y="180" width="0" height="40">
      <animate attributeName="width" values="0;0;600;600;0;0" keyTimes="0;0.66;0.74;0.94;0.95;1" dur="15s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#bgfade)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <circle cx="170" cy="150" r="190" fill="url(#halo)"/>

  <!-- scanning line -->
  <rect x="0" y="0" width="1000" height="46" fill="url(#scan)">
    <animate attributeName="y" values="-46;300" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- arc reactor -->
  <g filter="url(#glow)">
    <circle cx="170" cy="150" r="120" fill="none" stroke="#0f4c6b" stroke-width="1"/>
    <g>
      <circle cx="170" cy="150" r="108" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="3 9"/>
      <animateTransform attributeName="transform" type="rotate" from="0 170 150" to="360 170 150" dur="30s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="170" cy="150" r="92" fill="none" stroke="#2979ff" stroke-width="4" stroke-dasharray="70 22 12 22"/>
      <animateTransform attributeName="transform" type="rotate" from="360 170 150" to="0 170 150" dur="18s" repeatCount="indefinite"/>
    </g>
    <circle cx="170" cy="150" r="76" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.55"/>
    <g fill="#00e5ff" opacity="0.9">
      <rect x="163" y="82" width="14" height="22" rx="2"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(36 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(72 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(108 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(144 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(180 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(216 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(252 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(288 170 150)"/>
      <rect x="163" y="82" width="14" height="22" rx="2" transform="rotate(324 170 150)"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    </g>
    <circle cx="170" cy="150" r="52" fill="none" stroke="#bff4ff" stroke-width="1" opacity="0.6"/>
    <circle cx="170" cy="150" r="40" fill="url(#core)">
      <animate attributeName="r" values="36;42;36" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="150" r="12" fill="#ffffff"/>
  </g>

  <!-- title -->
  <text x="360" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#e6fbff" filter="url(#glow)" letter-spacing="1">Anil Bishnoi</text>
  <text x="362" y="152" font-family="'Courier New',Consolas,monospace" font-size="18" fill="#4dd0e1" letter-spacing="2">Building intelligent systems</text>
  <line x1="362" y1="168" x2="640" y2="168" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>

  <!-- typing lines -->
  <g font-family="'Courier New',Consolas,monospace" font-size="22" fill="#7df3ff">
    <text x="362" y="206" clip-path="url(#t1)">&gt; Training models. Training myself.</text>
    <text x="362" y="206" clip-path="url(#t2)">&gt; Python. Data. Models. Ship it.</text>
    <text x="362" y="206" clip-path="url(#t3)">&gt; Turning data into decisions</text>
  </g>

  <!-- status -->
  <circle cx="812" cy="31" r="4" fill="#00ff9d">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="962" y="36" text-anchor="end" font-family="'Courier New',Consolas,monospace" font-size="13" fill="#4dd0e1" letter-spacing="2">SYSTEM ONLINE</text>

  <!-- corner brackets -->
  <g fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8">
    <path d="M14 44V14H44"/>
    <path d="M956 14H986V44"/>
    <path d="M14 256V286H44"/>
    <path d="M956 286H986V256"/>
  </g>

  <!-- tick line -->
  <line x1="360" y1="270" x2="940" y2="270" stroke="#0f6a94" stroke-width="3" stroke-dasharray="2 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>
