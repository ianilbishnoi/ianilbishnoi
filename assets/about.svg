<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="About Anil: online, figuring it out, building AI systems, open to collabs, internships and open source" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#0b2b45" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="panel"><rect x="0" y="0" width="1000" height="290"/></clipPath>
    <clipPath id="c0"><rect x="40" y="78" width="0" height="30"><animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.0278;0.0889;0.93;0.94;1" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c1"><rect x="40" y="108" width="0" height="30"><animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.1111;0.1722;0.93;0.94;1" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c2"><rect x="40" y="138" width="0" height="30"><animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.1944;0.2556;0.93;0.94;1" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c3"><rect x="40" y="168" width="0" height="30"><animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.2778;0.3389;0.93;0.94;1" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c4"><rect x="40" y="198" width="0" height="30"><animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.3611;0.4222;0.93;0.94;1" dur="18s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c5"><rect x="40" y="228" width="0" height="30"><animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.4444;0.5056;0.93;0.94;1" dur="18s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1000" height="290" fill="#05080f"/>
  <rect width="1000" height="290" fill="url(#grid)"/>

  <g clip-path="url(#panel)">
    <rect x="0" y="0" width="1000" height="40" fill="url(#scan)">
      <animate attributeName="y" values="-40;290" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title bar -->
  <rect x="1" y="1" width="998" height="38" fill="#07121f" stroke="#0f4c6b"/>
  <circle cx="26" cy="20" r="5" fill="#00e5ff"/>
  <circle cx="46" cy="20" r="5" fill="#2979ff" opacity="0.8"/>
  <circle cx="66" cy="20" r="5" fill="#0f6a94"/>
  <text x="500" y="25" text-anchor="middle" font-family="'Courier New',Consolas,monospace" font-size="14" fill="#4dd0e1" letter-spacing="2">anil.exe</text>

  <!-- lines -->
  <g font-family="'Courier New',Consolas,monospace" font-size="20" fill="#4dd0e1">
    <text x="40" y="100" clip-path="url(#c0)">&gt; booting anil.exe ...</text><text x="40" y="130" clip-path="url(#c1)">&gt; status ......... <tspan fill="#00ff9d">online</tspan></text><text x="40" y="160" clip-path="url(#c2)">&gt; mode ........... <tspan fill="#e6fbff">figuring it out</tspan></text><text x="40" y="190" clip-path="url(#c3)">&gt; building ....... <tspan fill="#e6fbff">AI systems</tspan></text><text x="40" y="220" clip-path="url(#c4)">&gt; next drop ...... <tspan fill="#ffd54a">loading</tspan></text><text x="40" y="250" clip-path="url(#c5)">&gt; open to ........ <tspan fill="#e6fbff">collabs, internships, open source</tspan></text>
  </g>

  <!-- cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5056;0.5066;0.93;0.94;1" dur="18s" repeatCount="indefinite"/>
    <rect x="670" y="233" width="11" height="22" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- brackets -->
  <g fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.85">
    <path d="M10 262V280H28"/>
    <path d="M972 280H990V262"/>
  </g>
</svg>
